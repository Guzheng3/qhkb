name: qhkb
description: 清涵课表应用 - 支持小米超级岛
publish_to: 'none'
version: 5.2.0-1+140
repository: https://github.com/Guzheng3/qhkb
homepage: https://github.com/Guzheng3/qhkb
issue_tracker: https://github.com/Guzheng3/qhkb/issues
license: GPL-3.0-or-later

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  uuid: ^4.6.0
  cupertino_icons: ^1.0.8
  file_picker: ^11.0.3
  http: ^1.2.2
  pub_semver: ^2.2.1
  package_info_plus: ^9.0.1
  # 天气「使用当前位置」用。国行设备没装 Google Play Services 时，插件会自己
  # 回退到系统 LocationManager，所以无需 GMS、也不必设 forceLocationManager。
  # 反查地名不走这个包（它不提供），走高德逆地理编码，见 weather_service.dart。
  #
  # 约束写 ^14.0.0 而不是 ^14.0.3：14.0.3 要求 geolocator_linux ^0.2.6，后者要求
  # package_info_plus ^10.0.0，而本项目锁在 ^9.0.1——升级 package_info_plus 会连带
  # 10.2.0 的 Android Gradle/Kotlin 构建改动，与本功能无关且我这边没法验证构建。
  # 写 ^14.0.0 让 pub 自己回退：实测解析到 geolocator 14.0.2 + geolocator_linux 0.2.4
  # （后者兼容 package_info_plus 9）。将来 package_info_plus 升上去后，这个约束会
  # 自动解析到更新的 geolocator，不必再改。
  geolocator: ^14.0.0
  share_plus: ^12.0.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  path_provider: ^2.1.5
  open_filex: ^4.7.0
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: ^10.3.1
  webview_flutter: 4.14.1
  webview_flutter_android: 4.13.0
  azlistview: ^2.0.0
  animations: ^2.0.11
  table_parser: ^1.0.1
  qr_flutter: ^4.1.0
  fl_chart: ^1.3.0
  flutter_svg: ^2.3.0
  image: ^4.8.0
  flutter_miuix:
    git:
      url: https://github.com/Mutx163/flutter_miuix.git
      ref: 241bbea65291e2a2f7b36d77946f7f1d16654b0a
  flutter_blackbox: ^0.7.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/home_page_wallpaper/
    - assets/holidays/
    - assets/warehouse/
    - assets/warehouse/SCUEC/
    - assets/warehouse/MYSY/
    - docs/releases/
    - assets/templates/
  fonts:
    - family: DancingScript
      fonts:
        - asset: assets/fonts/DancingScript-Variable.ttf
